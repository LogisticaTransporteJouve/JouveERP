<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#f3f4f8; --surface:#fff; --ink:#1b1e28; --muted:#5f6688; --faint:#8b91a9; --line:#d8dbe6; --soft:#eceef4;
  --accent:#2a64a8; --accent-soft:#e2ebf7; --accent-ink:#fff;
  --warn:#b2427a; --warn-soft:#f7e6ef; --good:#0f7f69;
  --sans:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#121317; --surface:#1b1d22; --ink:#e8e9ec; --muted:#a0a4ad; --faint:#6c707a; --line:#343842; --soft:#23262c;
  --accent:#8e9cf5; --accent-soft:#252a4a; --accent-ink:#121317;
  --warn:#e58fb8; --warn-soft:#3a2230; --good:#5fd0b4;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121317; --surface:#1b1d22; --ink:#e8e9ec; --muted:#a0a4ad; --faint:#6c707a; --line:#343842; --soft:#23262c;
  --accent:#8e9cf5; --accent-soft:#252a4a; --accent-ink:#121317;
  --warn:#e58fb8; --warn-soft:#3a2230; --good:#5fd0b4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:28px 72px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
.lede{font-size:16px;color:var(--muted);max-width:66ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.case{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-width:820px}
.case .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.case .story{font-size:14.5px}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;gap:7px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px}
.person .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;background:var(--soft);color:var(--ink)}
.person.ai .av{background:var(--accent);color:var(--accent-ink)}
.person small{color:var(--muted)}
svg.d{width:100%;height:auto;display:block;font-family:var(--sans)}
svg.d text{fill:var(--ink);font-size:12px}
svg.d text.s{fill:var(--muted);font-size:10.5px}
svg.d text.t{font-weight:600;font-size:12.5px}
svg.d text.el{fill:var(--muted);font-size:10.5px}
svg.d text.hl{fill:var(--accent);font-weight:600}
svg.d text.w{fill:var(--warn);font-weight:600}
svg.d text.m{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
svg.d text.del{fill:var(--faint);text-decoration:line-through}
svg.d .bx{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
svg.d .bx.soft{fill:var(--soft);stroke:none}
svg.d .bx.on{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
svg.d .bx.warn{fill:var(--warn-soft);stroke:var(--warn)}
svg.d .bx.dash{stroke-dasharray:4 3;fill:none}
svg.d .ed{fill:none;stroke:var(--faint);stroke-width:1.3}
svg.d .ed.on{stroke:var(--accent);stroke-width:2.2}
svg.d .ed.warn{stroke:var(--warn)}
svg.d .ed.dash{stroke-dasharray:4 3}
svg.d .ln{stroke:var(--line);stroke-width:1}
svg.d .lnd{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
svg.d .acc{fill:var(--accent)} svg.d .wrn{fill:var(--warn)}
.ah{fill:var(--faint)} .ahon{fill:var(--accent)} .ahw{fill:var(--warn)}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure .fx{overflow-x:auto;background:var(--ground);border-radius:8px;padding:12px}
figcaption{font-size:12px;color:var(--muted)}
.walk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.walk{grid-template-columns:1fr}}
.map{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;position:sticky;top:12px}
@media (max-width:900px){.map{position:static}}
.map .flow{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.map .flow b{color:var(--ink)}
.steps{display:flex;flex-direction:column;gap:14px}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.picker .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.picker button[aria-current="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.picker button[aria-current="true"] .n{color:var(--ground);opacity:.7}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card .num{font-family:var(--mono);font-size:12px;color:var(--accent);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:11px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 7px}
.card h2{font-size:21px;font-weight:600}
.card .what{font-size:15px;max-width:60ch}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.facts li{display:grid;grid-template-columns:14px 1fr;gap:8px;font-size:13.5px}
.facts li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);margin-top:8px}
.facts li.flag::before{background:var(--warn);width:8px;height:8px;margin-top:6px}
.where{border-top:1px solid var(--line);padding-top:10px}
.where summary{cursor:pointer;font-size:12px;color:var(--muted)}
.where ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.where li{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.nav{display:flex;justify-content:space-between;gap:8px}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px}
.nav button:disabled{opacity:.35;cursor:default}
.nav button.next{background:var(--ink);color:var(--ground);border-color:var(--ink)}
section{display:flex;flex-direction:column;gap:12px}
section > h2{font-size:20px;font-weight:600}
section > .sub{color:var(--muted);max-width:66ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.gotchas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.g{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.g b{font-size:14px;font-weight:600}
.g p{font-size:13px;color:var(--muted)}
.g .why{font-size:12px;color:var(--warn);font-weight:500}
.g.ok .why{color:var(--accent)}
.g .k{font-family:var(--mono);font-size:11px;color:var(--muted)}
footer{font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8z" class="ah"/></marker>
<marker id="ahon" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8z" class="ahon"/></marker>
<marker id="ahw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8z" class="ahw"/></marker>
</defs></svg>
<div class="wrap">
  <header>
    <div class="top">
      <span class="eyebrow" data-i="eyebrow"></span>
      <div class="lang" role="group" aria-label="Language">
        <button aria-pressed="true" data-l="es">ES</button>
        <button aria-pressed="false" data-l="en">EN</button>
      </div>
    </div>
    <h1 data-i="title"></h1>
    <p class="lede" data-i="lede"></p>
  </header>
  <div class="case">
    <span class="lbl" data-i="caseL"></span>
    <p class="story" data-i="caseStory"></p>
    <div class="people" id="people"></div>
  </div>
  <div class="walk">
    <aside class="map"><div id="map"></div><p class="flow" id="flow"></p></aside>
    <div class="steps">
      <div class="picker" id="picker"></div>
      <article class="card" id="card" aria-live="polite"></article>
      <div class="nav"><button id="prev"></button><button id="next" class="next"></button></div>
    </div>
  </div>
  <div id="sections" style="display:flex;flex-direction:column;gap:40px"></div>
  <footer data-i="foot"></footer>
</div>
<script>
let lang="es",cur=0;
try{const s=localStorage.getItem("td-explain-lang");if(s==="en"||s==="es")lang=s;}catch(e){}
const L=(es,en)=>lang==="es"?es:en;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const svg=(w,h,label,body)=>`<svg class="d" style="max-width:${Math.round(w*1.2)}px" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${body}</svg>`;
const box=(x,y,w,h,t,s,c="")=>`<rect class="bx ${c}" x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/>`+
  (s?`<text class="t" x="${x+w/2}" y="${y+h/2-3}" text-anchor="middle">${t}</text><text class="s" x="${x+w/2}" y="${y+h/2+11}" text-anchor="middle">${s}</text>`
    :`<text class="t" x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle">${t}</text>`);
const tx=(x,y,t,c="",a="start")=>`<text class="${c}" x="${x}" y="${y}" text-anchor="${a}">${t}</text>`;
const ar=(d,c="")=>{const m=c.includes("on")?"ahon":c.includes("warn")?"ahw":"ah";return `<path class="ed ${c}" d="${d}" marker-end="url(#${m})"/>`;};
const fig=(s,cap)=>`<figure><div class="fx">${s}</div><figcaption>${cap}</figcaption></figure>`;
/* soft list: title + items; item prefix "w:" warn, "a:" accent, "x:" struck */
const list=(x,y,w,title,items,c="soft")=>{const h=24+items.length*16;let b=`<rect class="bx ${c}" x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/>`+tx(x+10,y+17,title,"t");
  items.forEach((it,i)=>{let cl="s",t=it;if(it.startsWith("w:")){cl="s w";t=it.slice(2);}else if(it.startsWith("a:")){cl="s hl";t=it.slice(2);}else if(it.startsWith("x:")){cl="s del";t=it.slice(2);}b+=tx(x+10,y+34+i*16,t,cl);});return b;};
/* matrix: cols, rows [label,[vals]] vals: y accent dot, w warn dot, - dash, other → text (prefix w:/a:) */
const matrix=(W,x0,cw,cols,rows,rh=38,title="")=>{let b="";cols.forEach((c,i)=>b+=tx(x0+i*cw,22,c,"t","middle"));
  rows.forEach(([r,v],j)=>{const y=40+j*rh;b+=`<line class="ln" x1="10" y1="${y-6}" x2="${W-10}" y2="${y-6}"/>`+tx(14,y+rh/2-1,r,"");
    v.forEach((k,i)=>{const x=x0+i*cw,cy=y+rh/2-5;
      if(k==="y")b+=`<circle class="acc" cx="${x}" cy="${cy}" r="6.5"/>`;
      else if(k==="w")b+=`<circle class="wrn" cx="${x}" cy="${cy}" r="6.5"/>`;
      else if(k==="-")b+=tx(x,cy+4,"—","s","middle");
      else{let cl="el",t=k;if(k.startsWith("w:")){cl="el w";t=k.slice(2);}else if(k.startsWith("a:")){cl="el hl";t=k.slice(2);}b+=tx(x,cy+4,t,cl,"middle");}});});
  return {b,h:40+rows.length*rh};};

name: Aikido Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  aikido-scan:
    name: Aikido scan
    # Same gate as the Claude review workflow: drafts skip the scan to
    # avoid noisy notifications on work-in-progress branches. The scan
    # runs once when the PR is marked ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aikido scan
        # Pinned to v1.0.13 SHA per AikidoSec's own "pin third-party
        # actions" recommendation. Bump the comment + SHA together when
        # upgrading.
        uses: AikidoSec/github-actions-workflow@47d83dbcf3e6635044c4b31cef590c1e095217cc # v1.0.13
        with:
          secret-key: ${{ secrets.AIKIDO_SECRET_KEY }}
          # Block the PR only when a new CRITICAL issue appears. HIGH/
          # MEDIUM still show up as findings in the Aikido dashboard but
          # don't fail CI — that prevents noise from blocking unrelated
          # merges.
          minimum-severity: CRITICAL
          fail-on-dependency-scan: "true"
          fail-on-sast-scan: "true"
          fail-on-iac-scan: "false"
          # Single status comment that updates over the lifetime of the
          # PR; only appears when there are new findings.
          post-scan-status-comment: "only_if_new_findings"
          post-sast-review-comments: "on"
          github-token: ${{ secrets.GITHUB_TOKEN }}

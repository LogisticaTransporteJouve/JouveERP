name: Deploy database migrations

# Pushes any pending migrations + types-changes to the linked Supabase
# project once they merge to main. The job is idempotent: `supabase db push`
# only applies migrations that aren't yet recorded in
# `supabase_migrations.schema_migrations`, so re-running is safe.
#
# Approval gate: the `approve` job enters the `production-gate` environment,
# which has required reviewers and no secrets; `deploy` enters `production`,
# which holds the secrets and no reviewers, and needs `approve`. So nothing
# reaches production until someone approves the run.
# .github/scripts/check-production-jobs-gated.py (run in CI) keeps it that way.
#
# Required GitHub environments (Settings → Environments):
#   production-gate — required reviewers on, no secrets.
#   production      — the secrets below; restrict to the `main` branch.
#
# Required secrets in the `production` environment:
#   SUPABASE_ACCESS_TOKEN  — personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — the 20-char ref of the production project
#                            (Settings → General → Reference ID)
#   SUPABASE_DB_PASSWORD   — the postgres user password set when the
#                            project was created (NOT the JWT secret)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-deploy.yml"
      - "scripts/supabase-cli-version"
  workflow_dispatch:

# Never cancel an in-flight deploy: a push killed mid-migration can leave the
# database half-migrated. A newer run queues behind it instead.
concurrency:
  group: db-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  approve:
    name: Approve production migrations
    runs-on: ubuntu-latest
    environment: production-gate
    timeout-minutes: 5
    steps:
      - run: echo "approved"

  deploy:
    name: Push migrations to production
    needs: approve
    runs-on: ubuntu-latest
    environment: production
    # Budget for the slowest migration, not a measurement: a cancel in the
    # middle of a long migration (index build, backfill) is worse than waiting.
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bail out if secrets are missing
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] \
             || [ -z "${SUPABASE_PROJECT_ID}" ] \
             || [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::Missing one or more Supabase secrets. Configure SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD."
            exit 1
          fi

      - name: Resolve pinned Supabase CLI version
        run: echo "SUPABASE_CLI_VERSION=$(sed 's/^supabase@//' scripts/supabase-cli-version)" >> "$GITHUB_ENV"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        run: supabase db push --include-all

name: CI

# The push trigger re-validates the exact SHA that landed on main: PR runs
# test a merge preview, so two PRs that are green in isolation can still break
# in combination once both land. Push runs on main also deploy migrations.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels that PR's stale run. Main push runs each get a
# group of their own, so every landed SHA is validated and no in-flight
# migration deploy is ever cancelled by a newer push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth 0 brings every branch, the PR base included, so no later
      # step needs the token (the format check diffs against the base too).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # PR runs diff against the PR's base branch; push runs diff against the
      # previous main head. A degenerate push base (a head force-pushed out of
      # history) falls back to the root commit, which makes every diff select
      # everything: the run degrades to run-all, never to run-nothing.
      - name: Resolve diff base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            candidate="$BEFORE"
          else
            candidate="origin/$BASE_REF"
          fi
          if [ -n "$candidate" ] && [ "$candidate" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$candidate^{commit}" 2>/dev/null; then
            echo "ref=$candidate" >> "$GITHUB_OUTPUT"
            echo "range=$candidate..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No usable diff base ('$candidate'), falling back to the root commit, which runs everything."
            echo "ref=$(git rev-list --max-parents=0 HEAD | head -n 1)" >> "$GITHUB_OUTPUT"
            # <root>..HEAD would leave the root commit itself unscanned.
            echo "range=HEAD" >> "$GITHUB_OUTPUT"
          fi

      # The word list is a secret so it is never spelled out in the repo.
      # Secrets do not reach fork or Dependabot PRs, so only those may skip;
      # everywhere else a missing secret fails the run. It runs before any
      # other script from the branch so none can tamper with the tools it
      # calls. It only guards against leaking the word by accident: anyone who
      # can push a branch can also edit this workflow and read the secret.
      - name: No forbidden words in files, names, commits or branch
        env:
          FORBIDDEN_WORDS: ${{ secrets.FORBIDDEN_WORDS }}
          REQUIRE_FORBIDDEN_WORDS: ${{ (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && '1' || '' }}
          FORBIDDEN_WORDS_RANGE: ${{ steps.base.outputs.range }}
          FORBIDDEN_WORDS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-forbidden-words.sh

      # Workflow gates: stdlib Python, before dependencies are installed, so a
      # PR touching only .github/ is still policed. A green gate run prints
      # "ok" and proves nothing about the parser itself, so each parser gets
      # its own fixtures.
      - name: Every actions/checkout sets persist-credentials
        run: python3 .github/scripts/check-checkout-persist-credentials.py

      - name: Checkout-credentials gate self-test
        run: python3 .github/scripts/check_checkout_persist_credentials_test.py

      - name: Every production job needs approval
        run: python3 .github/scripts/check-production-jobs-gated.py

      - name: Production-approval gate self-test
        run: python3 .github/scripts/check_production_jobs_gated_test.py

      - name: Run scripts interpolate no PR or dispatch input
        run: python3 .github/scripts/check-run-script-input.py

      - name: Run-script-input gate self-test
        run: python3 .github/scripts/check_run_script_input_test.py

      - name: Every repo path a skill names exists
        run: python3 .github/scripts/check-skill-refs.py

      - name: Skill-refs gate self-test
        run: python3 .github/scripts/check_skill_refs_test.py

      - name: Setup pnpm
        # Version is read from the root package.json "packageManager" field.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reads the lockfile only. Non-blocking for now: main already carries
      # high/critical advisories (next, sharp, ...). Flip continue-on-error to
      # false once they are cleared so new ones block the merge.
      - name: Audit dependencies (prod, high+)
        continue-on-error: true
        run: pnpm audit --audit-level=high --prod

      # Only files this PR (or push) changed — see scripts/ci-format-check.sh.
      - name: Check formatting (changed files)
        env:
          FORMAT_BASE_REF: ${{ steps.base.outputs.ref }}
        run: bash scripts/ci-format-check.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Every PR and push: the new-migration checks (scripts/check-migrations.sh)
  # and their self-tests, then — only when the database surface changed — a
  # fresh local stack with every migration applied, plpgsql_check, the types
  # drift check and pgTAP. On PRs, the append-only check.
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: read lets the re-propose step read past deploy runs.
    permissions:
      contents: read
      actions: read
    outputs:
      migrations: ${{ steps.migrations.outputs.changed || steps.changes.outputs.migrations }}
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # PR runs compare against the PR's base branch; push runs against the
      # previous main head, or the first parent when that head is gone
      # (force-push), so the checks never run against nothing.
      - name: Resolve diff base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base="$BEFORE"
            else
              echo "::warning::No usable push base ('$BEFORE'), comparing against HEAD^."
              base="$(git rev-parse HEAD^)"
            fi
            label="main (before this push)"
          else
            base="origin/${BASE_REF}"
            label="$BASE_REF"
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "BASE_LABEL=$label" >> "$GITHUB_ENV"

      # The DB steps below only run when something they cover changed.
      # `migrations` feeds deploy-migrations: on a push it asks for approval
      # only when there is something new to apply.
      - name: Detect relevant changes
        id: changes
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${BASE}...HEAD")"
          if printf '%s\n' "$changed" \
            | grep -E '^(supabase/migrations/|supabase/tests/|lib/db/database\.types\.ts$|scripts/db-types.*\.sh$|scripts/supabase-cli-version$|\.github/workflows/ci\.yml$)' >/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes — skipping the local stack, lint and types drift check."
          fi
          if printf '%s\n' "$changed" | grep -E '^(supabase/migrations/|scripts/supabase-cli-version$)' >/dev/null; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

      # A push asks for approval when the migrations differ from the last push
      # whose deploy succeeded, so a migration a red run, a failed deploy or a
      # rejected approval left behind goes out with the next push. Run outcomes
      # come from the Actions API. When no successful deploy is found (or the
      # API errors) the diff against the previous head above decides instead.
      - name: Migrations changed since the last deploy
        id: migrations
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_CHANGED: ${{ steps.changes.outputs.migrations }}
        run: |
          last=""
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' || true)"
          while read -r id sha; do
            [ -n "$id" ] || continue
            deploy="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "Push migrations to production") | .conclusion' </dev/null || true)"
            if [ "$deploy" = "success" ]; then
              last="$sha"
              break
            fi
          done <<<"$runs"
          if [ -z "$last" ]; then
            echo "No successful migration deploy found; using the diff against the previous head."
            echo "changed=$CLI_CHANGED" >> "$GITHUB_OUTPUT"
          elif [ "$CLI_CHANGED" = "true" ] \
            || ! git merge-base --is-ancestor "$last" HEAD 2>/dev/null \
            || ! git diff --quiet "$last" HEAD -- supabase/migrations/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Name, version order, all-or-nothing statements, no session-level SET,
      # SECURITY DEFINER revokes and squawk, over the migrations this change
      # adds. The push run repeats it because two PRs green on their own can
      # land out of order, and deploy-migrations needs this job.
      - name: New migrations (name, version, transaction, SET, definer revoke, squawk)
        run: bash scripts/check-migrations.sh "$BASE"

      - name: Script self-tests (migration checks, squawk config, dev binds)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:scripts

      - name: Resolve pinned Supabase CLI version
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' }}
        run: echo "SUPABASE_CLI_VERSION=$(sed 's/^supabase@//' scripts/supabase-cli-version)" >> "$GITHUB_ENV"

      - name: Setup Supabase CLI
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' }}
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Runs even when the migration checks failed, so one push reports
      # whether they apply.
      - name: Start Supabase
        id: db
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' }}
        # Only what the checks below use: Postgres, Auth and the API. The log
        # is printed only on failure.
        run: |
          supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/supabase-start.log" 2>&1 || { cat "$RUNNER_TEMP/supabase-start.log"; exit 1; }

      # plpgsql_check over every function in `public`, once every migration
      # has applied. Errors only: warnings are a separate decision.
      - name: DB function lint (plpgsql_check)
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: supabase db lint --local --schema public --level error --fail-on error

      # Runs even when the lint failed, so one push reports both.
      - name: Check types drift
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: bash scripts/db-types-check.sh

      # pgTAP over supabase/tests. `supabase test db` passes an empty suite,
      # so a missing directory fails here instead.
      - name: DB tests (pgTAP)
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: |
          shopt -s nullglob
          files=(supabase/tests/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::supabase/tests has no pgTAP files."
            exit 1
          fi
          supabase test db --local

      - name: Stop Supabase
        if: always() && steps.changes.outputs.relevant == 'true'
        run: supabase stop --no-backup

      # Migrations are append-only: once merged, a file may have been applied
      # to production, and editing it there is a silent no-op (supabase only
      # records the version). Fix forward with a new migration instead. On a
      # push the change already landed; the PR is where it can be stopped.
      - name: Merged migrations are append-only
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          touched=$(git diff --diff-filter=MDRCT --name-status "${BASE}...HEAD" -- supabase/migrations)

          if [ -z "$touched" ]; then
            echo "No existing migration was modified, deleted or renamed."
            exit 0
          fi

          # <status>\t<path on base>[\t<new path>] (renames/copies carry both).
          while IFS=$'\t' read -r status file new_path; do
            echo "::error file=${file}::${status} ${file}${new_path:+ -> ${new_path}}: merged migrations are append-only — never edit, delete or rename one on ${BASE_LABEL}; add a new migration that fixes forward."
          done <<< "$touched"
          exit 1

  # Approval gate: `approve` enters the `production-gate` environment, which
  # has required reviewers and no secrets; `deploy-migrations` enters
  # `production`, which holds the secrets and no reviewers, and needs
  # `approve`. So nothing reaches production until someone approves the run.
  # .github/scripts/check-production-jobs-gated.py keeps it that way.
  #
  # Push-only, no workflow_dispatch: a dispatch from another branch would
  # apply its migrations, which are recorded and never re-run.
  approve:
    name: Approve production migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.database.outputs.migrations == 'true'
    needs: [database]
    runs-on: ubuntu-latest
    environment: production-gate
    timeout-minutes: 5
    steps:
      - run: echo "approved"

  # Pushes any pending migrations to the linked Supabase project. Idempotent:
  # `supabase db push` only applies migrations that aren't yet recorded in
  # `supabase_migrations.schema_migrations`, so re-running is safe.
  #
  # Required GitHub environments (Settings → Environments):
  #   production-gate — required reviewers on, no secrets.
  #   production      — the secrets below; restrict to the `main` branch.
  #
  # Required secrets in the `production` environment:
  #   SUPABASE_ACCESS_TOKEN  — personal access token from
  #                            https://supabase.com/dashboard/account/tokens
  #   SUPABASE_PROJECT_ID    — the 20-char ref of the production project
  #                            (Settings → General → Reference ID)
  #   SUPABASE_DB_PASSWORD   — the postgres user password set when the
  #                            project was created (NOT the JWT secret)
  deploy-migrations:
    name: Push migrations to production
    needs: [approve]
    runs-on: ubuntu-latest
    environment: production
    # Budget for the slowest migration, not a measurement: a cancel in the
    # middle of a long migration (index build, backfill) is worse than waiting.
    timeout-minutes: 60
    # Never cancel an in-flight deploy: a push killed mid-migration can leave
    # the database half-migrated. A newer run queues behind it instead.
    concurrency:
      group: db-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bail out if secrets are missing
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] \
             || [ -z "${SUPABASE_PROJECT_ID}" ] \
             || [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::Missing one or more Supabase secrets. Configure SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD."
            exit 1
          fi

      - name: Resolve pinned Supabase CLI version
        run: echo "SUPABASE_CLI_VERSION=$(sed 's/^supabase@//' scripts/supabase-cli-version)" >> "$GITHUB_ENV"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        run: supabase db push --include-all

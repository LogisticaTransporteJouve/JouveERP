name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the format check diffs against the base branch.
          fetch-depth: 0
          persist-credentials: false

      # Workflow gates: stdlib Python, before dependencies are installed, so a
      # PR touching only .github/ is still policed.
      - name: Every checkout sets persist-credentials
        run: |
          python3 .github/scripts/check-checkout-persist-credentials.py
          python3 .github/scripts/check_checkout_persist_credentials_test.py

      - name: Every production job needs approval
        run: |
          python3 .github/scripts/check-production-jobs-gated.py
          python3 .github/scripts/check_production_jobs_gated_test.py

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only files this PR (or push) changed — see scripts/ci-format-check.sh.
      - name: Check formatting (changed files)
        env:
          FORMAT_BASE_REF: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
        run: bash scripts/ci-format-check.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  audit:
    name: Dependency audit (prod, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Reads the lockfile only; no install needed.
      # Non-blocking for now: main already carries high/critical advisories
      # (next, sharp, ...). Flip continue-on-error to false once they are
      # cleared so new ones block the merge.
      - name: pnpm audit
        continue-on-error: true
        run: pnpm audit --audit-level=high --prod

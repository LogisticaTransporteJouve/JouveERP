name: DB types drift

# Runs on every PR so this required check always reports a status.
# Branch protection treats path-filtered workflows as permanently pending
# on PRs that don't touch the filtered paths, blocking the merge. We do
# the path filter inside the job and short-circuit when irrelevant.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Regenerate types and diff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -E '^(supabase/migrations/|lib/db/database\.types\.ts$|scripts/db-types.*\.sh$|scripts/supabase-cli-version$|\.github/workflows/db-types-check\.yml$)' >/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes — skipping types drift check."
          fi

      - name: Resolve pinned Supabase CLI version
        if: steps.changes.outputs.relevant == 'true'
        run: echo "SUPABASE_CLI_VERSION=$(sed 's/^supabase@//' scripts/supabase-cli-version)" >> "$GITHUB_ENV"

      - name: Setup Supabase CLI
        if: steps.changes.outputs.relevant == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start Supabase
        if: steps.changes.outputs.relevant == 'true'
        run: supabase start

      # plpgsql_check over every function in `public`, once every migration
      # has applied. Errors only: warnings are a separate decision.
      - name: DB function lint (plpgsql_check)
        if: steps.changes.outputs.relevant == 'true'
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Check types drift
        if: steps.changes.outputs.relevant == 'true'
        run: bash scripts/db-types-check.sh

      - name: Stop Supabase
        if: always() && steps.changes.outputs.relevant == 'true'
        run: supabase stop --no-backup

name: Backup diario de la base

# Corre todos los días a las 03:00 UTC (00:00 ART). Hace pg_dump en
# formato custom comprimido y sube el .dump al bucket `backups-daily`
# de Supabase Storage. Después borra los archivos > 30 días.
#
# Requiere los siguientes secrets en GitHub:
#   - DATABASE_URL: la URL del "Session pooler" (Supabase Dashboard → Connect).
#     La "Direct connection" es solo IPv6 y los runners de GitHub no tienen IPv6.
#   - SUPABASE_URL: https://<project>.supabase.co
#   - SUPABASE_SERVICE_ROLE_KEY: del Supabase Dashboard → Settings → API
#   - SLACK_WEBHOOK_URL: (opcional) para notificación de éxito/error
#
# Se puede correr manualmente desde la pestaña Actions con
# "Run workflow" para probar.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RETENTION_DAYS: "30"
      BUCKET: "backups-daily"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bail out if secrets are missing
        run: |
          if [ -z "${DATABASE_URL}" ] \
             || [ -z "${SUPABASE_URL}" ] \
             || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Faltan secrets. Configurá DATABASE_URL, SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY en Settings → Secrets and variables → Actions."
            exit 1
          fi

      # pg_dump refuses a server newer than itself, and the runner ships 16
      # while the project runs 17 (supabase/config.toml major_version).
      - name: Setup pg_dump (Postgres 17 client)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: pg_dump version
        run: pg_dump --version

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install supabase-js
        run: npm install --no-save @supabase/supabase-js@2

      - name: Dump database
        id: dump
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          FILE="backup-${DATE}.dump"
          echo "Dumping to $FILE ..."
          # custom format (Fc) + compresión nivel 9 + sin owner para
          # que el restore funcione contra cualquier rol target.
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-acl \
            --file="$FILE"
          SIZE=$(stat -c %s "$FILE")
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"  >> "$GITHUB_OUTPUT"
          echo "Dump OK — ${SIZE} bytes, sha256=${SHA}"

      - name: Upload + prune old (Node)
        env:
          DUMP_FILE: ${{ steps.dump.outputs.file }}
          DUMP_SIZE: ${{ steps.dump.outputs.size }}
          DUMP_SHA: ${{ steps.dump.outputs.sha }}
        run: node .github/workflows/backup-upload.mjs

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          MB=$(( ${{ steps.dump.outputs.size }} / 1024 / 1024 ))
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"✅ Backup JouveERP OK — ${{ steps.dump.outputs.file }} (${MB} MB, sha=${{ steps.dump.outputs.sha }})\"}" \
            "$SLACK_WEBHOOK_URL" || true

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text": "❌ Backup JouveERP FALLÓ — revisar https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "$SLACK_WEBHOOK_URL" || true

name: Migration order

# Runs on every PR (no `paths:` filter) so this required check always
# reports a status — branch protection treats path-filtered workflows as
# permanently pending, blocking merges on PRs that don't touch migrations.
# The job itself short-circuits when no migrations changed.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  order:
    name: Migration timestamps must be strictly increasing
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Migrations are append-only: once merged, a file may have been applied
      # to production, and editing it there is a silent no-op (supabase only
      # records the version). Fix forward with a new migration instead.
      - name: Existing migrations are append-only
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"

          touched=$(git diff --diff-filter=MDRCT --name-status "${base}...HEAD" -- supabase/migrations)

          if [ -z "$touched" ]; then
            echo "No existing migration was modified, deleted or renamed."
            exit 0
          fi

          # <status>\t<path on base>[\t<new path>] (renames/copies carry both).
          while IFS=$'\t' read -r status file new_path; do
            echo "::error file=${file}::${status} ${file}${new_path:+ -> ${new_path}}: merged migrations are append-only — never edit, delete or rename one on ${BASE_REF}; add a new migration that fixes forward."
          done <<< "$touched"
          exit 1

      - name: New migration names and timestamps
        # Report naming/order problems even when the append-only step failed.
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"

          # --no-renames: a rename shows up as the file it adds, so its name
          # and stamp are checked too (the append-only step rejects the
          # rest). Every added file under supabase/migrations is checked,
          # not just files that already look like migrations: a misnamed
          # file must fail, not be skipped.
          changed=$(git diff --no-renames --diff-filter=A --name-only "${base}...HEAD" -- supabase/migrations)

          if [ -z "$changed" ]; then
            echo "No new migrations in this PR."
            exit 0
          fi

          # Highest timestamp on the base branch. The listing is filtered to
          # well-formed names so a stray file cannot become the max.
          latest_timestamp=$(git ls-tree --name-only "$base" supabase/migrations/ \
            | sed 's|.*/||' \
            | grep -E '^[0-9]{14}_' \
            | cut -c1-14 \
            | sort -n \
            | tail -n 1 || true)

          # Stamps are UTC (`supabase migration new` writes UTC). A day of
          # slack covers a hand-written stamp from a timezone ahead of UTC.
          now=$(date -u +%Y%m%d%H%M%S)
          max_allowed=$(date -u -d '+1 day' +%Y%m%d%H%M%S)

          # An empty bound turns every comparison below into a silent no-op,
          # which is worse than no gate at all.
          if ! [[ "$latest_timestamp" =~ ^[0-9]{14}$ ]] || ! [[ "$max_allowed" =~ ^[0-9]{14}$ ]]; then
            echo "::error::Migration gate could not determine its bounds (newest on ${BASE_REF}: '${latest_timestamp}', future cutoff: '${max_allowed}'). Refusing to pass without checking."
            exit 1
          fi

          echo "Newest migration on ${BASE_REF}: ${latest_timestamp} (now ${now} UTC)"

          errors=0
          while IFS= read -r file; do
            name="${file#supabase/migrations/}"
            if ! [[ "$name" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=${file}::${name} is not a valid migration name. Use supabase/migrations/<YYYYMMDDHHMMSS>_<snake_case>.sql (lowercase, digits and _ only)."
              errors=$((errors + 1))
              continue
            fi
            timestamp="${name:0:14}"
            if [ "$timestamp" -gt "$max_allowed" ]; then
              echo "::error file=${file}::${name} is stamped ${timestamp}, more than a day in the future (now ${now} UTC). Every later migration would have to beat it — restamp it with the current UTC time."
              errors=$((errors + 1))
            elif [ "$timestamp" -le "$latest_timestamp" ]; then
              echo "::error file=${file}::${name} is stamped ${timestamp}, not after ${BASE_REF}'s newest ${latest_timestamp}. Two PRs likely raced — rebase and rename the file with a fresher timestamp."
              errors=$((errors + 1))
            else
              echo "OK: ${name}"
            fi
          done <<< "$changed"

          if [ "$errors" -gt 0 ]; then
            echo "${errors} migration file(s) rejected."
            exit 1
          fi

name: Claude Code Review

on:
  pull_request:
    # `ready_for_review` triggers cuando un draft se marca listo. Sumado
    # al `if: !draft` abajo, esto evita gastar tokens mientras el PR
    # está en draft: corre una sola vez cuando lo abrís en serio.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    name: Review PR with Claude
    # Solo PRs no-draft. Cada push a un draft saltea esta job sin
    # gastar tokens.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load business rules context
        id: context
        run: |
          {
            echo "BUSINESS_RULES<<__EOF__"
            cat .github/claude-review-context.md
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-4-7
            --max-turns 25
            --allowed-tools "Bash(gh:*),Read,Grep,Glob"
          prompt: |
            Estás revisando el PR #${{ github.event.pull_request.number }}
            del repo ${{ github.repository }} (branch
            `${{ github.event.pull_request.head.ref }}` → `main`).

            Pasos obligatorios:
            1. Leé el diff completo:
               `gh pr diff ${{ github.event.pull_request.number }}`
            2. Si necesitás más contexto, leé archivos adyacentes con
               `Read` o buscá patrones con `Grep`.
            3. Aplicá las reglas del contexto JouveERP de abajo.
            4. POSTEÁ tu review como comentario en el PR con
               `gh pr comment ${{ github.event.pull_request.number }} --body "..."`
               usando un heredoc para preservar formato:
               ```
               gh pr comment ${{ github.event.pull_request.number }} --body-file - <<'COMMENT_EOF'
               ## Code review
               ...
               COMMENT_EOF
               ```
               No olvides este paso — sin el comment posteado, la review no le
               sirve a nadie.

            ${{ env.BUSINESS_RULES }}
